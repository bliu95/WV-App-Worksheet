<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Worksheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes gradientSlide {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      body {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        background-color: #e4ecf7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .card {
        background: #fff;
        width: 100%;
        max-width: 860px;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(30, 80, 180, 0.10);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid #c4d4ea;
      }

      /* Loading Screen */
      .loading-state {
        padding: 40px;
        text-align: center;
        color: #888;
        font-size: 1.1rem;
        display: none;
      }

      /* 1. Header (Title) */
      .header-section {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #c4d4ea;
        background: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .header-left {
        display: flex;
        flex-direction: column;
      }

      .header-right {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .step-badge {
        background: linear-gradient(135deg, #d0e2f7, #b8d0f0);
        color: #1a5fb4;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: inline-block;
        margin-bottom: 0.25rem;
      }

      h2 {
        margin: 0;
        color: #1a2a40;
        font-size: 1.4rem;
      }

      #week-select {
        width: 90px;
      }

      #section-select {
        width: 325px;
      }

      /* 2. Image Component */
      .image-section {
        background-color: #eef3fa;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem 0;
        border-bottom: 1px solid #c4d4ea;
        min-height: 300px;
      }

      .image-section img {
        max-width: 95%;
        max-height: 400px;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(30, 80, 180, 0.08);
        object-fit: contain;
        display: none;
      }

      /* 3. Text Component */
      .text-section {
        padding: 2rem;
        color: #2c3e50;
        line-height: 1.7;
        font-size: 1.05rem;
        flex-grow: 1;
        min-height: 100px;
      }

      /* Block Introduction Section */
      .block-intro {
        margin-top: 1.5rem;
        padding: 1rem;
        background-color: #eef3fa;
        border-radius: 10px;
        border-left: 4px solid #2563eb;
      }

      .block-intro-header {
        font-weight: bold;
        margin-bottom: 0.5rem;
        color: #1a2a40;
      }

      .block-intro img {
        max-width: 100%;
        max-height: 300px;
        margin: 0.5rem 0;
        border-radius: 6px;
      }

      .block-intro-description {
        color: #5a6d80;
        font-size: 0.95rem;
      }

      /* 4. Controls (Next/Back) */
      .controls {
        display: flex;
        justify-content: space-between;
        padding: 1.25rem 2rem;
        background-color: #fff;
        border-top: 1px solid #c4d4ea;
      }

      button {
        background: linear-gradient(135deg, #2f6fce, #2563eb);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      }

      button:disabled {
        background: #c0ccd8;
        color: #8294a5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      select {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #a8bed6;
        font-family: inherit;
        font-size: 0.9rem;
        background: #eef3fa;
        color: #2c3e50;
      }

      select:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }

      /* Week Picker Landing Page */
      .week-picker {
        padding: 2.5rem 2rem;
        text-align: center;
      }

      .week-picker h1 {
        margin: 0 0 1.5rem 0;
        color: transparent;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #1a5fb4, #2563eb, #3b82f6);
        background-size: 200% 200%;
        animation: gradientSlide 8s ease infinite;
        -webkit-background-clip: text;
        background-clip: text;
      }

      .week-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }

      .week-btn {
        padding: 20px 14px;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        background: #eef3fa;
        color: #2c3e50;
        border: 1px solid #b4c8de;
        transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
      }

      .week-btn:hover {
        background: #dbe6f4;
        border-color: #5a8ec4;
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.18);
        color: #1a2a40;
      }

      .week-btn-sub {
        font-size: 0.75rem;
        font-weight: 400;
        opacity: 0.55;
      }

      .back-btn {
        background: none;
        color: #2563eb;
        border: none;
        padding: 4px 10px;
        font-size: 0.85rem;
        cursor: pointer;
        font-weight: 600;
        border-radius: 6px;
      }

      .back-btn:hover {
        background: #dbe6f4;
      }

    </style>
  </head>
  <body>
    <div class="card">

      <!-- Week Picker Landing Page -->
      <div id="week-picker" class="week-picker">
        <h1>Activities</h1>
        <div id="week-grid" class="week-grid"></div>
      </div>

      <!-- External Lesson View -->
      <div id="external-content" style="display: none;">
        <div class="quiz-header" style="padding: 1rem 1.5rem; border-bottom: 1px solid #c4d4ea; background: #fff; display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
          <div class="header-left">
            <h2 id="external-title"></h2>
          </div>
          <div class="header-right">
            <button class="back-btn" onclick="showWeekPicker()">All Activities</button>
          </div>
        </div>
        <div class="text-section" style="text-align: center;">
          <p>Follow the instructions on the Google Doc:</p>
          <p><a id="external-link" href="" target="_blank" style="font-size: 1.1rem;">Open Google Doc</a></p>
        </div>
      </div>

      <div id="loading-msg" class="loading-state">
        Loading...
      </div>

      <div id="main-content" style="display: none;">
        <div class="header-section">
          <div class="header-left">
            <div id="step-badge" class="step-badge">Step 1</div>
            <h2 id="step-title">Welcome</h2>
          </div>
          <div class="header-right">
            <button class="back-btn" onclick="showWeekPicker()">All Activities</button>
            <select id="week-select" onchange="handleWeekChange()"></select>
            <select id="section-select" onchange="handleSectionChange()"></select>
          </div>
        </div>

        <div class="image-section" id="image-block">
          <img id="step-image" src="" alt="Step visualization" />
        </div>

        <div id="step-text" class="text-section">
            Select a lesson below to begin.
        </div>

        <div class="controls">
          <button id="btn-back" onclick="changeStep(-1)">Back</button>
          <button id="btn-next" onclick="changeStep(1)">Next</button>
        </div>
      </div>


    </div>

    <script>
      let allSteps = [];        // All steps from the markdown file
      let sections = [];        // Array of sections, each with start/end indices
      let currentSection = 0;   // Currently selected section index
      let currentStepInSection = 0;  // Current step within the section

      const externalLessons = {
          "Week 1": {
              name: "Intro to Thunkable",
              url: "https://docs.google.com/document/d/1a2y7Bd2SU92oke_ljLAV2MeYOEnjChoplp-Q1MxO5hs/edit?tab=t.qvzce3ekmdfr#heading=h.lgmn96lyee3h",
          },
          "Week 3 Part 1": {
              name: "Data Table App",
              url: "https://docs.google.com/document/d/1y3EaUvS6m13RFANcpdegZJpMg19dtOajbEf8it9bwOE/edit?tab=t.m8n3hes8um33#heading=h.lgmn96lyee3h",
          },
      };

      const lessonData = {
          "Week 2": "./Weeks/Week 2/w2_guide.md",
          "Week 3 Part 2": "./Weeks/Week 5/w5_guide.md",
          "Week 4": "./Weeks/Week 4/w4_guide.md",
      };

      const lessonNames = {
          "Week 2": "High Low",
          "Week 3 Part 2": "Data Filtering App",
          "Week 4": "Quiz App",
      };

      // Convert "Week 2" -> "week2", "Week 3 Part 1" -> "week3part1"
      function weekToSlug(week) {
          return week.toLowerCase().replace(/\s+/g, '');
      }

      // Convert "week2" -> "Week 2", "week3part2" -> "Week 3 Part 2"
      function slugToWeek(slug) {
          return Object.keys(lessonData).find(w => weekToSlug(w) === slug) || null;
      }

      function slugToExternalLesson(slug) {
          return Object.keys(externalLessons).find(w => weekToSlug(w) === slug) || null;
      }

      function selectExternalLesson(week) {
          window.location.hash = weekToSlug(week);
      }

      function showExternalLesson(week) {
          const lesson = externalLessons[week];
          document.getElementById('external-title').textContent = lesson.name + ' (' + week + ')';
          document.getElementById('external-link').href = lesson.url;
          document.getElementById('week-picker').style.display = 'none';
          document.getElementById('main-content').style.display = 'none';
          document.getElementById('external-content').style.display = '';
      }

      // Initialize
      function init() {
          const weekSelect = document.getElementById('week-select');
          const weekGrid = document.getElementById('week-grid');

          // Combine all weeks and sort by week number
          const allWeeks = [
              ...Object.keys(externalLessons).map(w => ({ week: w, type: 'external' })),
              ...Object.keys(lessonData).map(w => ({ week: w, type: 'lesson' })),
          ].sort((a, b) => parseInt(a.week.replace('Week ', '')) - parseInt(b.week.replace('Week ', '')));

          allWeeks.forEach(({ week, type }) => {
              const weekNum = week.replace('Week ', '');
              const btn = document.createElement('button');
              btn.className = 'week-btn';

              if (type === 'external') {
                  const lesson = externalLessons[week];
                  btn.innerHTML = lesson.name + '<br><span class="week-btn-sub">(' + week + ')</span>';
                  btn.onclick = () => selectExternalLesson(week);
              } else {
                  const option = document.createElement('option');
                  option.value = week;
                  option.textContent = week;
                  weekSelect.appendChild(option);

                  const name = lessonNames[week] || week;
                  btn.innerHTML = name + '<br><span class="week-btn-sub">(' + week + ')</span>';
                  btn.onclick = () => selectWeek(week);
              }
              weekGrid.appendChild(btn);
          });

          // Check URL hash for a direct week link
          handleHashChange();
      }

      function selectWeek(week) {
          window.location.hash = weekToSlug(week);
      }

      function showWeekPicker() {
          history.pushState(null, '', window.location.pathname);
          document.getElementById('main-content').style.display = 'none';
          document.getElementById('external-content').style.display = 'none';
          document.getElementById('week-picker').style.display = '';
      }

      function handleHashChange() {
          const hash = window.location.hash.slice(1); // remove '#'
          if (hash) {
              // Check for external lesson hash
              const extWeek = slugToExternalLesson(hash);
              if (extWeek) {
                  showExternalLesson(extWeek);
                  return;
              }
              const week = slugToWeek(hash);
              if (week) {
                  document.getElementById('week-select').value = week;
                  document.getElementById('week-picker').style.display = 'none';
                  document.getElementById('external-content').style.display = 'none';
                  document.getElementById('main-content').style.display = '';

                  handleWeekChange();
                  return;
              }
          }
          // No valid hash — show the picker
          document.getElementById('main-content').style.display = 'none';
          document.getElementById('external-content').style.display = 'none';
          document.getElementById('week-picker').style.display = '';
      }

      window.addEventListener('hashchange', handleHashChange);

      function handleWeekChange() {
          const weekSelect = document.getElementById('week-select');
          const selectedWeek = weekSelect.value;
          // Keep hash in sync when changing via dropdown
          const currentSlug = window.location.hash.slice(1);
          if (weekToSlug(selectedWeek) !== currentSlug) {
              window.location.hash = weekToSlug(selectedWeek);
              return; // hashchange handler will call handleWeekChange again
          }
          const filename = lessonData[selectedWeek];
          loadMarkdownFile(filename);
      }

      function handleSectionChange() {
          const sectionSelect = document.getElementById('section-select');
          currentSection = parseInt(sectionSelect.value, 10);
          currentStepInSection = 0;
          renderStep();
      }

      // Fetch Logic
      function loadMarkdownFile(filename) {
          currentSection = 0;
          currentStepInSection = 0;
          document.getElementById("main-content").style.opacity = "0.5";
          document.getElementById("loading-msg").style.display = "block";

          fetch(filename)
            .then((response) => {
              if (!response.ok) throw new Error("Could not find " + filename);
              return response.text();
            })
            .then((text) => {
              allSteps = parseMarkdown(text);
              sections = splitIntoSections(allSteps);

              document.getElementById("loading-msg").style.display = "none";
              document.getElementById("main-content").style.opacity = "1";

              populateSectionDropdown();
              renderStep();
            })
            .catch((error) => {
              document.getElementById("loading-msg").innerHTML = `Error: ${error.message}`;
              document.getElementById("loading-msg").style.display = "block";
              console.error(error);
            });
      }

      // Parse Markdown
      function parseMarkdown(md) {
        const rawSteps = md.split(/^---$/m);

        // First pass: parse all steps
        const parsedSteps = rawSteps
          .map((stepContent) => {
            const lines = stepContent.trim().split("\n");
            let title = "Step";
            let image = "";
            let textLines = [];
            let isCheckpoint = false;
            let checkpointName = null;
            let isBlockIntro = false;
            let blockName = "";
            let blockNameStyled = "";
            let blockImage = "";
            let blockDescription = "";

            lines.forEach((line) => {
              const trimmed = line.trim();
              if (trimmed.startsWith("# ")) {
                title = trimmed.replace("# ", "");
              } else if (trimmed.match(/!\[.*?\]\(.*?\)/)) {
                const match = trimmed.match(/\((.*?)\)/);
                if (match) image = match[1];
              } else if (trimmed.length > 0) {
                // Check for checkpoint or extension marker
                const checkpointMatch = trimmed.match(/\[([^\]]*(Checkpoint|Extension)[^\]]*)\]/i);
                if (checkpointMatch) {
                  isCheckpoint = true;
                  checkpointName = checkpointMatch[1].replace(/<[^>]*>/g, '').trim();
                }
                // Check for block introduction marker
                const blockMatch = trimmed.match(/font-weight:bold[^>]*>Block:<\/span>\s*(<span[^>]*>([^<]*)<\/span>[^<]*)/i);
                if (blockMatch) {
                  isBlockIntro = true;
                  blockNameStyled = blockMatch[1].trim();  // Preserve styled HTML span
                  blockName = blockMatch[2].trim();  // Plain text name for alt attribute
                }
                let parsed = trimmed
                  .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
                  .replace(/`(.*?)`/g, '<code style="background:#eee;padding:2px 5px;border-radius:4px">$1</code>')
                  .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

                // Check if this is a list item (ordered or unordered, with optional indent for sublists)
                const indent = line.length - line.trimStart().length;
                const listMatch = parsed.match(/^(\d+)\.\s+(.*)$/);
                const letterMatch = parsed.match(/^([a-z])[.)]\s+(.*)$/);
                const unorderedMatch = parsed.match(/^[-*]\s+(.*)$/);
                if (listMatch) {
                  parsed = `<li data-indent="${indent}" value="${listMatch[1]}">${listMatch[2]}</li>`;
                } else if (letterMatch) {
                  parsed = `<li data-indent="${indent}" data-letter="true">${letterMatch[2]}</li>`;
                } else if (unorderedMatch) {
                  parsed = `<li data-indent="${indent}" data-ul="true">${unorderedMatch[1]}</li>`;
                }
                textLines.push(parsed);
              }
            });

            // For block intros, extract the block image and description
            if (isBlockIntro) {
              blockImage = image;
              // The description is all text after the block name line
              const textContent = textLines.join("<br>");
              const descMatch = textContent.split("<br>").slice(1).join("<br>").trim();
              blockDescription = descMatch;
            }

            // Wrap consecutive <li> elements in nested <ol>/<ul> tags
            let textContent = textLines.join("<br>");
            textContent = textContent.replace(/(<li[^>]*>.*?<\/li>)(<br><li[^>]*>.*?<\/li>)*/g, function(match) {
              const items = match.split('<br>').filter(s => s.trim());
              let result = '';
              let stack = []; // track open list tags and their indent levels

              items.forEach(item => {
                const indentMatch = item.match(/data-indent="(\d+)"/);
                const isUl = item.includes('data-ul="true"');
                const isLetter = item.includes('data-letter="true"');
                const indent = indentMatch ? parseInt(indentMatch[1]) : 0;
                const tag = isUl ? 'ul' : (isLetter ? 'ol type="a"' : 'ol');
                const closeTag = isUl ? 'ul' : 'ol';
                // Clean data attributes from the li
                const cleanItem = item.replace(/\s*data-indent="\d+"/, '').replace(/\s*data-ul="true"/, '').replace(/\s*data-letter="true"/, '');

                if (stack.length === 0) {
                  result += `<${tag}>`;
                  stack.push({ indent, closeTag });
                } else {
                  const top = stack[stack.length - 1];
                  if (indent > top.indent) {
                    // Open a nested list
                    result += `<${tag}>`;
                    stack.push({ indent, closeTag });
                  } else {
                    // Close lists until we reach the right level
                    while (stack.length > 1 && stack[stack.length - 1].indent > indent) {
                      const closed = stack.pop();
                      result += `</${closed.closeTag}>`;
                    }
                    // If tag type changed at same level, close and reopen
                    if (stack.length > 0 && stack[stack.length - 1].indent === indent && stack[stack.length - 1].closeTag !== closeTag) {
                      const closed = stack.pop();
                      result += `</${closed.closeTag}><${tag}>`;
                      stack.push({ indent, closeTag });
                    }
                  }
                }
                result += cleanItem;
              });

              // Close all remaining open tags
              while (stack.length > 0) {
                const closed = stack.pop();
                result += `</${closed.closeTag}>`;
              }
              return result;
            });

            return {
              title,
              image,
              text: textContent,
              isCheckpoint,
              checkpointName,
              isBlockIntro,
              blockName,
              blockNameStyled,
              blockImage,
              blockDescription
            };
          })
          .filter((s) => s.text || s.image);

        // Second pass: merge block intros with the following step
        const mergedSteps = [];
        let pendingBlockIntro = null;

        for (let i = 0; i < parsedSteps.length; i++) {
          const step = parsedSteps[i];

          if (step.isBlockIntro && !step.isCheckpoint) {
            // Store this block intro to merge with the next step
            // (but not if it's also a checkpoint/extension - those should stand alone)
            pendingBlockIntro = step;
          } else {
            // This is a regular step or a checkpoint/extension
            if (pendingBlockIntro) {
              // Merge the pending block intro into this step
              step.blockIntro = {
                name: pendingBlockIntro.blockName,
                nameStyled: pendingBlockIntro.blockNameStyled,
                image: pendingBlockIntro.blockImage,
                description: pendingBlockIntro.blockDescription
              };
              pendingBlockIntro = null;
            }
            // For checkpoint/extension steps that have their own block intro content,
            // set blockIntro from their own data
            if (step.isCheckpoint && step.isBlockIntro && step.blockNameStyled) {
              step.blockIntro = {
                name: step.blockName,
                nameStyled: step.blockNameStyled,
                image: step.blockImage,
                description: step.blockDescription
              };
            }
            mergedSteps.push(step);
          }
        }

        return mergedSteps;
      }

      // Split steps into sections based on checkpoints
      function splitIntoSections(steps) {
        const result = [];
        let sectionStart = 0;

        steps.forEach((step, index) => {
          if (step.isCheckpoint) {
            result.push({
              name: step.checkpointName || `Checkpoint ${result.length + 1}`,
              startIndex: sectionStart,
              endIndex: index
            });
            sectionStart = index + 1;
          }
        });

        // If there are remaining steps after the last checkpoint, create a final section
        if (sectionStart < steps.length) {
          result.push({
            name: `Section ${result.length + 1} (Final)`,
            startIndex: sectionStart,
            endIndex: steps.length - 1
          });
        }

        return result;
      }

      function populateSectionDropdown() {
        const sectionSelect = document.getElementById('section-select');
        sectionSelect.innerHTML = "";

        sections.forEach((section, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = section.name;
          sectionSelect.appendChild(option);
        });
      }

      // Get steps for current section
      function getCurrentSectionSteps() {
        if (sections.length === 0) return [];
        const section = sections[currentSection];
        return allSteps.slice(section.startIndex, section.endIndex + 1);
      }

      // Render View
      function renderStep() {
        const sectionSteps = getCurrentSectionSteps();
        if (sectionSteps.length === 0) return;

        const current = sectionSteps[currentStepInSection];

        // Show "Overview" only for the first step of a section if it has no image
        if (currentStepInSection === 0 && !current.image) {
          document.getElementById("step-badge").innerText = "Overview";
        } else {
          // Count steps for numbering (excluding overview if present)
          const hasOverview = sectionSteps.length > 0 && !sectionSteps[0].image;
          const stepsToCount = hasOverview ? sectionSteps.slice(1) : sectionSteps;
          const adjustedIndex = hasOverview ? currentStepInSection - 1 : currentStepInSection;
          document.getElementById("step-badge").innerText = `Step ${adjustedIndex + 1} of ${stepsToCount.length}`;
        }
        document.getElementById("step-title").innerText = current.title;

        // Build the text content, including block intro if present
        let textContent = current.text;
        if (current.blockIntro) {
          textContent += `
            <div class="block-intro">
              <div class="block-intro-header">Block: ${current.blockIntro.nameStyled}</div>
              ${current.blockIntro.image ? `<img src="${current.blockIntro.image}" alt="Block: ${current.blockIntro.name}">` : ''}
              <div class="block-intro-description">${current.blockIntro.description}</div>
            </div>
          `;
        }
        document.getElementById("step-text").innerHTML = textContent;

        const imgEl = document.getElementById("step-image");
        if (current.image) {
          imgEl.src = current.image;
          imgEl.style.display = "block";
          document.getElementById("image-block").style.display = "flex";
        } else {
          imgEl.style.display = "none";
          document.getElementById("image-block").style.display = "none";
        }

        document.getElementById("btn-back").disabled = currentStepInSection === 0;

        const nextBtn = document.getElementById("btn-next");
        const isLastStepInSection = currentStepInSection === sectionSteps.length - 1;
        const isLastSection = currentSection === sections.length - 1;

        if (isLastStepInSection && isLastSection) {
          nextBtn.innerText = "Finish";
          nextBtn.disabled = true;
        } else if (isLastStepInSection) {
          nextBtn.innerText = "Next Section";
          nextBtn.disabled = false;
        } else {
          nextBtn.innerText = "Next";
          nextBtn.disabled = false;
        }
      }

      function changeStep(direction) {
        const sectionSteps = getCurrentSectionSteps();
        const nextIndex = currentStepInSection + direction;

        if (nextIndex >= 0 && nextIndex < sectionSteps.length) {
          currentStepInSection = nextIndex;
          renderStep();
        } else if (direction === 1 && nextIndex >= sectionSteps.length && currentSection < sections.length - 1) {
          // Move to next section
          currentSection++;
          currentStepInSection = 0;
          document.getElementById('section-select').value = currentSection;
          renderStep();
        }
      }

      // Start the app
      init();
    </script>
  </body>
</html>
